<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketch UI Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Architects+Daughter&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #c4c4c0;
      --paper: #d6d6d2;
      --paper2: #cbcbc7;
      --ink: #1d1d1d;
      --soft: #6b6b68;
      --hatch: repeating-linear-gradient(135deg, var(--ink) 0 1.5px, transparent 1.5px 6px);
      --wob: 255px 18px 225px 18px/18px 225px 18px 255px;
      --wob2: 14px 220px 16px 240px/230px 14px 250px 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Patrick Hand", "Architects Daughter", "Comic Sans MS", cursive;
      font-size: 18px;
      padding: 32px 20px 60px
    }

    h1 {
      text-align: center;
      font-family: "Architects Daughter", "Patrick Hand", cursive;
      letter-spacing: 3px;
      font-size: 30px
    }

    .sub {
      text-align: center;
      color: var(--soft);
      margin: 4px 0 32px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 28px;
      max-width: 1150px;
      margin: auto
    }

    .cap {
      text-align: center;
      color: var(--soft);
      font-size: 15px;
      margin-top: 8px
    }

    /* phone */
    .phone {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: var(--wob);
      height: 470px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 4px 5px 0 rgba(0, 0, 0, .18)
    }

    .body {
      flex: 1;
      overflow: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center
    }

    /* top bar + nav */
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 2.5px solid var(--ink)
    }

    .logo {
      font-family: "Architects Daughter", cursive;
      letter-spacing: 2px;
      font-size: 20px
    }

    .bar {
      height: 10px;
      background: var(--paper2);
      border: 2px solid var(--ink);
      border-radius: 3px;
      background-image: var(--hatch);
      flex: 1
    }

    .bar.fill {
      background-image: var(--hatch)
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-top: 2.5px solid var(--ink);
      background: var(--paper2)
    }

    .nav .grp {
      display: flex;
      gap: 18px
    }

    .nav button {
      background: none;
      border: 0;
      cursor: pointer;
      padding: 4px;
      color: var(--ink);
      opacity: .55;
      transition: .15s
    }

    .nav button:hover {
      opacity: .85
    }

    .nav button.on {
      opacity: 1;
      transform: translateY(-2px)
    }

    .nav button.on svg {
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35))
    }

    .nav svg {
      width: 26px;
      height: 26px;
      display: block
    }

    .ftlogo {
      text-align: center;
      border-top: 2.5px solid var(--ink);
      padding: 10px;
      background: var(--paper2);
      font-family: "Architects Daughter", cursive;
      letter-spacing: 3px;
      font-size: 22px
    }

    /* form */
    .field {
      display: block;
      width: 100%;
      border: 2.5px solid var(--ink);
      border-radius: var(--wob2);
      background: var(--paper2) var(--hatch);
      background-size: 100% 100%;
      padding: 9px 12px;
      font: inherit;
      color: var(--ink);
      outline: 0
    }

    .field {
      background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, .28) 0 1px, transparent 1px 6px)
    }

    .field::placeholder {
      color: #3a3a38
    }

    .field:focus {
      background-color: #dcdcd8;
      box-shadow: 3px 3px 0 var(--ink);
      transform: translate(-1px, -1px)
    }

    h2 {
      font-family: "Architects Daughter", cursive;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 20px;
      text-align: center
    }

    .reg {
      letter-spacing: 1px;
      font-size: 20px;
      text-align: center
    }

    /* buttons */
    .btn {
      font: inherit;
      color: var(--ink);
      cursor: pointer;
      background: var(--paper2);
      border: 2.5px solid var(--ink);
      border-radius: var(--wob2);
      padding: 8px 22px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      box-shadow: 3px 3px 0 var(--ink);
      transition: .1s
    }

    .btn:hover {
      background: #dcdcd8
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink)
    }

    .btn.wide {
      width: 100%
    }

    .btn.sm {
      padding: 3px 14px;
      font-size: 15px
    }

    /* placeholders */
    .ph {
      border: 2.5px solid var(--ink);
      border-radius: 8px 12px 7px 11px;
      background:
        linear-gradient(to top right, transparent calc(50% - 1.2px), var(--ink) calc(50% - 1.2px) calc(50% + 1.2px), transparent calc(50% + 1.2px)),
        linear-gradient(to bottom right, transparent calc(50% - 1.2px), var(--ink) calc(50% - 1.2px) calc(50% + 1.2px), transparent calc(50% + 1.2px)), var(--paper2)
    }

    .scribble {
      width: 100px;
      height: 100px;
      border: 3px solid var(--ink);
      border-radius: var(--wob2);
      background: var(--hatch);
      transform: rotate(-3deg)
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 3px solid var(--ink);
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: var(--paper2)
    }

    .avatar svg {
      width: 50px
    }

    .lines {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .lines i {
      display: block;
      height: 2.5px;
      background: var(--ink);
      border-radius: 2px
    }

    .lines i:nth-child(odd) {
      width: 100%
    }

    .lines i:nth-child(even) {
      width: 88%
    }

    .lines i:last-child {
      width: 55%
    }

    /* cards */
    .card {
      display: flex;
      gap: 10px;
      align-items: center;
      border: 2.5px solid var(--ink);
      border-radius: var(--wob2);
      padding: 8px;
      cursor: pointer;
      transition: .12s;
      background: var(--paper)
    }

    .card:hover,
    .card.sel {
      background: var(--paper2) var(--hatch);
      background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, .2) 0 1px, transparent 1px 6px);
      transform: translateX(3px)
    }

    .card .lines {
      flex: 1;
      gap: 9px
    }

    .card .ph {
      width: 62px;
      height: 54px;
      flex: none
    }

    .tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .tiles .ph {
      height: 84px;
      cursor: pointer;
      transition: .12s
    }

    .tiles .ph:hover {
      transform: rotate(-2deg) scale(1.04);
      box-shadow: 3px 3px 0 var(--ink)
    }

    .hero {
      height: 160px;
      border: 0;
      border-bottom: 2.5px solid var(--ink);
      border-radius: 0;
      flex: none
    }

    .hero.s {
      height: 120px
    }

    /* calendar */
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      justify-items: center;
      padding: 4px 2px
    }

    .cal b {
      width: 20px;
      height: 20px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      cursor: pointer;
      transition: .1s
    }

    .cal b:hover {
      background: var(--paper2)
    }

    .cal b.on {
      background: var(--ink)
    }

    .hatchhead {
      height: 78px;
      background: var(--hatch);
      border-bottom: 2.5px solid var(--ink);
      display: grid;
      place-items: center;
      flex: none;
      opacity: .9
    }

    .hatchhead .bar {
      flex: none;
      width: 70%;
      background-color: var(--paper)
    }
  </style>
</head>

<body>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="home" viewBox="0 0 24 24">
      <path d="M3 12 12 3l9 9M6 10v10h4v-6h4v6h4V10" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round" />
    </symbol>
    <symbol id="bag" viewBox="0 0 24 24">
      <path d="M5 9h14l1 12H4zM9 9V6a3 3 0 0 1 6 0v3" fill="currentColor" fill-opacity=".25" stroke="currentColor"
        stroke-width="2.2" stroke-linejoin="round" />
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M12 21C4 15 2 11 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3-2 7-10 13z" fill="currentColor" fill-opacity=".25"
        stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
    </symbol>
    <symbol id="user" viewBox="0 0 24 24">
      <circle cx="12" cy="6" r="3.5" fill="currentColor" />
      <path d="M5 22c0-6 2-9 7-9s7 3 7 9z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="2"
        stroke-linejoin="round" />
    </symbol>
    <symbol id="bell" viewBox="0 0 24 24">
      <path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round" />
    </symbol>
    <symbol id="arrow" viewBox="0 0 28 12">
      <path d="M1 6h24M19 1l6 5-6 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </symbol>
  </svg>

  <h1>SKETCH UI</h1>
  <p class="sub">wireframe preview &middot; form, button, navigation, cards</p>

  <div class="grid">

    <!-- 1 Welcome -->
    <div>
      <div class="phone">
        <div class="body center" style="gap:22px;flex:1">
          <div class="scribble"></div>
          <h2>WELCOME</h2>
        </div>
        <div style="padding:0 18px 24px"><button class="btn wide"><svg width="28" height="12">
              <use href="#arrow" />
            </svg></button></div>
      </div>
      <p class="cap">welcome / button</p>
    </div>

    <!-- 2 Registration form -->
    <div>
      <div class="phone">
        <div class="body" style="gap:11px">
          <div class="logo" style="text-align:center;font-size:24px;margin-top:4px">LOGO</div>
          <div class="reg">REGISTRATION</div>
          <input class="field" placeholder="name">
          <input class="field" placeholder="email" type="email">
          <input class="field" placeholder="password" type="password">
          <input class="field" placeholder="confirm password" type="password">
          <div style="text-align:center;margin-top:auto"><button class="btn">NEXT <svg width="22" height="10">
                <use href="#arrow" />
              </svg></button></div>
        </div>
      </div>
      <p class="cap">form / inputs</p>
    </div>

    <!-- 3 Profile -->
    <div>
      <div class="phone">
        <div class="body" style="gap:16px">
          <div class="avatar"><svg viewBox="0 0 24 24">
              <use href="#user" />
            </svg></div>
          <div class="bar" style="flex:none;height:14px"></div>
          <div class="lines"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="ftlogo">LOGO</div>
      </div>
      <p class="cap">profile</p>
    </div>

    <!-- 4 List -->
    <div>
      <div class="phone">
        <div class="top"><span class="logo">LOGO</span><span class="bar"></span><svg width="22" height="22">
            <use href="#bell" />
          </svg></div>
        <div class="body">
          <div class="bar" style="flex:none;width:70%;align-self:center"></div>
          <div class="card">
            <div class="lines"><i></i><i></i></div>
            <div class="ph"></div>
          </div>
          <div class="card sel">
            <div class="lines"><i></i><i></i></div>
            <div class="ph"></div>
          </div>
          <div class="card">
            <div class="lines"><i></i><i></i></div>
            <div class="ph"></div>
          </div>
        </div>
        <div class="nav" data-nav>
          <div><button class="on"><svg>
                <use href="#home" />
              </svg></button></div>
          <div class="grp"><button><svg>
                <use href="#bag" />
              </svg></button><button><svg>
                <use href="#heart" />
              </svg></button><button><svg>
                <use href="#user" />
              </svg></button></div>
        </div>
      </div>
      <p class="cap">list cards / bottom nav</p>
    </div>

    <!-- 5 Grid -->
    <div>
      <div class="phone">
        <div class="top"><span class="logo">LOGO</span><span class="bar"></span><svg width="22" height="22">
            <use href="#bell" />
          </svg></div>
        <div class="body">
          <div style="display:flex;gap:10px">
            <div class="bar" style="flex:3;height:14px"></div>
            <div class="bar" style="flex:1;height:14px"></div>
          </div>
          <div class="tiles">
            <div class="ph"></div>
            <div class="ph"></div>
            <div class="ph"></div>
            <div class="ph"></div>
            <div class="ph"></div>
            <div class="ph"></div>
          </div>
        </div>
        <div class="nav" data-nav>
          <div><button class="on"><svg>
                <use href="#home" />
              </svg></button></div>
          <div class="grp"><button><svg>
                <use href="#bag" />
              </svg></button><button><svg>
                <use href="#heart" />
              </svg></button><button><svg>
                <use href="#user" />
              </svg></button></div>
        </div>
      </div>
      <p class="cap">grid</p>
    </div>

    <!-- 6 Detail -->
    <div>
      <div class="phone">
        <div class="top"><span class="logo">LOGO</span><span class="bar"></span><svg width="22" height="22">
            <use href="#bell" />
          </svg></div>
        <div class="ph hero"></div>
        <div class="body" style="gap:14px">
          <div class="bar" style="flex:none;width:55%;align-self:center;height:14px"></div>
          <div class="lines"><i></i><i></i><i></i></div>
          <div style="text-align:right;margin-top:auto"><button class="btn sm">OK</button></div>
        </div>
        <div class="nav" data-nav>
          <div><button class="on"><svg>
                <use href="#home" />
              </svg></button></div>
          <div class="grp"><button><svg>
                <use href="#bag" />
              </svg></button><button><svg>
                <use href="#heart" />
              </svg></button><button><svg>
                <use href="#user" />
              </svg></button></div>
        </div>
      </div>
      <p class="cap">detail / ok button</p>
    </div>

    <!-- 7 Hero + cards -->
    <div>
      <div class="phone">
        <div class="top"><span class="logo">LOGO</span><span class="bar"></span><svg width="22" height="22">
            <use href="#bell" />
          </svg></div>
        <div class="ph hero s"></div>
        <div class="body">
          <div class="card">
            <div class="lines"><i></i><i></i><i></i></div>
            <div class="ph"></div>
          </div>
          <div class="card">
            <div class="lines"><i></i><i></i><i></i></div>
            <div class="ph"></div>
          </div>
        </div>
        <div class="nav" data-nav>
          <div><button class="on"><svg>
                <use href="#home" />
              </svg></button></div>
          <div class="grp"><button><svg>
                <use href="#bag" />
              </svg></button><button><svg>
                <use href="#heart" />
              </svg></button><button><svg>
                <use href="#user" />
              </svg></button></div>
        </div>
      </div>
      <p class="cap">hero + cards</p>
    </div>

    <!-- 8 Calendar -->
    <div>
      <div class="phone">
        <div class="top"><span class="logo">LOGO</span><span class="bar"></span><svg width="22" height="22">
            <use href="#bell" />
          </svg></div>
        <div class="hatchhead">
          <div class="bar"></div>
        </div>
        <div class="body" style="gap:14px">
          <div class="cal" id="cal"></div>
          <input class="field" placeholder="add a note..." style="margin-top:auto">
        </div>
        <div class="nav" data-nav>
          <div><button class="on"><svg>
                <use href="#home" />
              </svg></button></div>
          <div class="grp"><button><svg>
                <use href="#bag" />
              </svg></button><button><svg>
                <use href="#heart" />
              </svg></button><button><svg>
                <use href="#user" />
              </svg></button></div>
        </div>
      </div>
      <p class="cap">calendar / select</p>
    </div>

  </div>

  <script>
    // calendar dots
    const cal = document.getElementById('cal');
    for (let i = 0; i < 31; i++) {
      const b = document.createElement('b'); if (i === 11) b.className = 'on';
      b.onclick = () => { cal.querySelectorAll('b').forEach(x => x.classList.remove('on')); b.classList.add('on') }; cal.appendChild(b)
    }
    // nav active state
    document.querySelectorAll('[data-nav]').forEach(n => n.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      n.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on')
    }));
    // card select
    document.querySelectorAll('.card').forEach(c => c.onclick = () => {
      c.parentElement.querySelectorAll('.card').forEach(x => x.classList.remove('sel')); c.classList.add('sel')
    });
  </script>
</body>

</html>
